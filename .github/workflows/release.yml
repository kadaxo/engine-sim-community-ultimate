name: Release

# Builds the downloads: a Windows zip, a macOS app (Apple Silicon, unsigned)
# and a Linux tar.gz.
#
# - Run it by hand (Actions > Release > Run workflow) to get them as
#   artifacts of the run, to try before tagging. "platforms" picks which to
#   build.
# - Pushing a version tag such as v0.3.0 builds all three and creates a draft
#   GitHub release with them and SHA256SUMS. The tag must match the version
#   in CMakeLists.txt, and CHANGELOG.md needs a "## 0.3.0" section, which
#   becomes the release's "What's new". Check the draft, then publish it on
#   GitHub.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (any of windows, macos, linux)"
        default: "windows macos linux"
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  # Same vcpkg as the CI jobs that build Prism
  VCPKG_COMMIT: 817892b0ecbc6af994dd6df999c73faf795adbf2

jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || contains(inputs.platforms, 'windows')
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Flex and Bison
        shell: pwsh
        run: |
          $installed = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            choco install winflexbison3 --yes --no-progress
            if ($LASTEXITCODE -eq 0) {
              $installed = $true
              break
            }
            if ($attempt -lt 4) {
              Write-Warning "Chocolatey failed; retrying in 20 seconds"
              Start-Sleep -Seconds 20
            }
          }
          if (-not $installed) {
            throw "Chocolatey could not install winflexbison3 after four attempts"
          }
          $flex = (Get-Command win_flex.exe -ErrorAction Stop).Source
          $bison = (Get-Command win_bison.exe -ErrorAction Stop).Source
          "FLEX_EXECUTABLE=$flex" | Out-File $env:GITHUB_ENV -Append
          "BISON_EXECUTABLE=$bison" | Out-File $env:GITHUB_ENV -Append

      - name: Restore built vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-release-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('cmake/vcpkg-overlay-ports/**') }}

      # SDL2 and the encoders as DLLs (LAME's license wants it replaceable);
      # Prism's port only builds as a static library
      - name: Build the libraries with vcpkg
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:RUNNER_TEMP vcpkg
          git clone https://github.com/microsoft/vcpkg.git $vcpkg
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git -C $vcpkg checkout $env:VCPKG_COMMIT
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$vcpkg/vcpkg.exe" install `
            sdl2:x64-windows sdl2-image:x64-windows `
            libvorbis:x64-windows mp3lame:x64-windows `
            ethindp-prism:x64-windows-static-md `
            "--overlay-ports=$env:GITHUB_WORKSPACE/cmake/vcpkg-overlay-ports"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "VCPKG_ROOT_PINNED=$vcpkg" | Out-File $env:GITHUB_ENV -Append

      - name: Save built vcpkg packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            "-DFLEX_EXECUTABLE=$env:FLEX_EXECUTABLE" `
            "-DBISON_EXECUTABLE=$env:BISON_EXECUTABLE" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT_PINNED/scripts/buildsystems/vcpkg.cmake" `
            "-DCMAKE_PREFIX_PATH=$env:VCPKG_ROOT_PINNED/installed/x64-windows-static-md" |
            Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # A download without speech or an encoder would look fine, so fail here
          $expected = @(
            "Screen reader output: enabled (Prism)",
            "engine-sim-export: Ogg Vorbis enabled",
            "engine-sim-export: MP3 enabled"
          )
          foreach ($line in $expected) {
            if (-not (Select-String -Path configure.log -SimpleMatch $line -Quiet)) {
              throw "Configure output lacks '$line'"
            }
          }

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ env.BUILD_TYPE }} -LE slow --output-on-failure

      - name: Package
        id: package
        shell: pwsh
        run: ./scripts/package-windows.ps1 -BuildDir build -Config $env:BUILD_TYPE -OutDir dist

      # licenses/README.txt says LAME is a DLL that can be replaced
      - name: List the package
        shell: pwsh
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          $stage = "dist/stage/engine-sim-community-$env:VERSION-windows-x64"
          Get-ChildItem $stage | Format-Table Name, Length -AutoSize | Out-String -Width 200
          Get-ChildItem "$stage/licenses" -Name
          if (-not (Test-Path "$stage/libmp3lame.dll")) {
            throw "libmp3lame.dll is not in the package"
          }

      - name: Check the version against the tag
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if ($env:TAG -ne "v$env:VERSION") {
            throw "Tag $env:TAG doesn't match the version in CMakeLists.txt ($env:VERSION)"
          }

      # Uploaded as the zip itself, so the run's download isn't a zip in a zip
      - name: Upload the zip
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.zip }}
          archive: false
          if-no-files-found: error

  # Apple Silicon, macOS 11 or newer. SDL2 and everything else from vcpkg is
  # linked statically (delta-studio patch 0018 links SDL2's CMake package),
  # so the app needs nothing from Homebrew. Not signed with a developer ID:
  # scripts/package.sh signs it ad hoc.
  macos:
    if: github.event_name != 'workflow_dispatch' || contains(inputs.platforms, 'macos')
    # macOS 26 on Apple Silicon (what macos-latest means now; macos-15 runners
    # were often busy). Its Xcode 26 builds for macOS 11 and newer.
    runs-on: macos-26
    timeout-minutes: 120
    env:
      # Keep in step with cmake/vcpkg-triplets/engine-sim-arm64-osx.cmake
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      VCPKG_TRIPLET: engine-sim-arm64-osx

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Build tools only; no libraries come from Homebrew. The grammar needs
      # bison 3.2 or newer (macOS ships 2.3), and the scanner flex writes
      # needs that flex's FlexLexer.h.
      - name: Install build tools
        run: |
          brew install bison flex autoconf autoconf-archive automake libtool pkg-config
          echo "BISON_EXECUTABLE=$(brew --prefix bison)/bin/bison" >> "$GITHUB_ENV"
          echo "FLEX_EXECUTABLE=$(brew --prefix flex)/bin/flex" >> "$GITHUB_ENV"
          echo "FLEX_INCLUDE_DIR=$(brew --prefix flex)/include" >> "$GITHUB_ENV"

      - name: Restore built vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-release-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-triplets/**') }}
          restore-keys: |
            vcpkg-release-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_COMMIT }}-

      - name: Build the libraries with vcpkg
        id: vcpkg-build
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_COMMIT"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          "$RUNNER_TEMP/vcpkg/vcpkg" install \
            sdl2 sdl2-image libvorbis mp3lame ethindp-prism \
            --triplet "$VCPKG_TRIPLET" \
            --overlay-triplets="$GITHUB_WORKSPACE/cmake/vcpkg-triplets" \
            --overlay-ports="$GITHUB_WORKSPACE/cmake/vcpkg-overlay-ports"

      # Also when vcpkg failed, under a key of its own, so the packages it
      # did build are restored next time instead of built again
      - name: Save built vcpkg packages
        if: ${{ !cancelled() && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ steps.vcpkg-build.outcome == 'success' && steps.vcpkg-cache.outputs.cache-primary-key || format('{0}-partial-{1}', steps.vcpkg-cache.outputs.cache-primary-key, github.run_id) }}

      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            "-DCMAKE_TOOLCHAIN_FILE=$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            "-DVCPKG_TARGET_TRIPLET=$VCPKG_TRIPLET" \
            -DDELTA_SDL2_CMAKE_PACKAGE=ON \
            "-DBISON_EXECUTABLE=$BISON_EXECUTABLE" \
            "-DFLEX_EXECUTABLE=$FLEX_EXECUTABLE" \
            "-DFLEX_INCLUDE_DIR=$FLEX_INCLUDE_DIR" | tee configure.log
          for line in "Screen reader output: enabled (Prism)" \
              "engine-sim-export: Ogg Vorbis enabled" "engine-sim-export: MP3 enabled"; do
            grep -qF "$line" configure.log || { echo "::error::Configure output lacks '$line'"; exit 1; }
          done

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build -LE slow --output-on-failure

      - name: Package
        id: package
        run: bash scripts/package.sh build dist

      - name: Check the version against the tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG doesn't match the version in CMakeLists.txt ($VERSION)"
            exit 1
          fi

      - name: Upload the zip
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.archive }}
          archive: false
          if-no-files-found: error

  # x86-64, built on Ubuntu 22.04 so it runs on distributions with glibc
  # 2.35 or newer (Ubuntu 22.04, Debian 12, Fedora 36 and later). SDL2 and
  # SDL2_image come from the system; Prism and the encoders from vcpkg,
  # linked statically. Prism needs GCC 13's C++ library
  # (std::atomic_unsigned_lock_free), newer than Ubuntu 22.04's GCC 12: GCC
  # 13 comes from the ubuntu-toolchain-r PPA and its libstdc++ is linked into
  # the programs, so they don't need it on the user's system.
  linux:
    if: github.event_name != 'workflow_dispatch' || contains(inputs.platforms, 'linux')
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      CC: gcc-13
      CXX: g++-13
      VCPKG_TRIPLET: engine-sim-x64-linux

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 libsdl2-dev libsdl2-image-dev flex bison \
            autoconf autoconf-archive automake libtool libltdl-dev pkg-config \
            python3 python3-venv ninja-build xvfb

      # Restored here and saved right after vcpkg, so a later failure doesn't
      # throw away the hour that building GLib takes
      - name: Restore built vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-release-${{ runner.os }}-${{ runner.arch }}-ubuntu22-gcc13-${{ env.VCPKG_COMMIT }}-${{ hashFiles('cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-triplets/**') }}
          restore-keys: |
            vcpkg-release-${{ runner.os }}-${{ runner.arch }}-ubuntu22-gcc13-${{ env.VCPKG_COMMIT }}-

      - name: Build the libraries with vcpkg
        id: vcpkg-build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_COMMIT"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          # GLib's pcre2 fetches one file from api.github.com without signing
          # in, which shared runners often get refused; see cmake.yml
          mkdir -p "$RUNNER_TEMP/vcpkg/downloads"
          curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o "$RUNNER_TEMP/vcpkg/downloads/pcre2-pcre2-10.49-sljit-gitlink.json" \
            "https://api.github.com/repos/PCRE2Project/pcre2/contents/deps/sljit?ref=pcre2-10.49"
          "$RUNNER_TEMP/vcpkg/vcpkg" install \
            libvorbis mp3lame ethindp-prism \
            --triplet "$VCPKG_TRIPLET" \
            --overlay-triplets="$GITHUB_WORKSPACE/cmake/vcpkg-triplets" \
            --overlay-ports="$GITHUB_WORKSPACE/cmake/vcpkg-overlay-ports"

      # Also when vcpkg failed, under a key of its own, so the packages it
      # did build are restored next time instead of built again
      - name: Save built vcpkg packages
        if: ${{ !cancelled() && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ steps.vcpkg-build.outcome == 'success' && steps.vcpkg-cache.outputs.cache-primary-key || format('{0}-partial-{1}', steps.vcpkg-cache.outputs.cache-primary-key, github.run_id) }}

      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            "-DCMAKE_TOOLCHAIN_FILE=$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            "-DVCPKG_TARGET_TRIPLET=$VCPKG_TRIPLET" \
            "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc" | tee configure.log
          for line in "Screen reader output: enabled (Prism)" \
              "engine-sim-export: Ogg Vorbis enabled" "engine-sim-export: MP3 enabled"; do
            grep -qF "$line" configure.log || { echo "::error::Configure output lacks '$line'"; exit 1; }
          done

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build -LE slow --output-on-failure

      - name: Package
        id: package
        run: bash scripts/package.sh build dist

      - name: Check the version against the tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG doesn't match the version in CMakeLists.txt ($VERSION)"
            exit 1
          fi

      - name: Upload the tar.gz
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.archive }}
          archive: false
          if-no-files-found: error

  # Runs on manual runs too (with whichever platforms were built), so
  # everything but creating the release is tried before a tag depends on it
  publish:
    needs: [windows, macos, linux]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the changelog
        uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Download the builds
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Check the files and write SHA256SUMS
        run: |
          set -euo pipefail
          mkdir upload
          find dist -type f -print0 | xargs -0 -I{} mv {} upload/
          cd upload
          ls -l
          for f in *; do
            case "$f" in
              engine-sim-community-*.zip) unzip -tq "$f" ;;
              engine-sim-community-*.tar.gz) tar -tzf "$f" > /dev/null ;;
              *) echo "::error::Unexpected file $f"; exit 1 ;;
            esac
          done
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # On manual runs too, so a missing changelog entry shows before tagging
      - name: Write the release notes
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
          else
            VERSION=$(ls upload | sed -n -E 's/^engine-sim-community-(.+)-(windows-x64|macos-arm64|linux-x64)\..*$/\1/p' | head -n 1)
          fi
          # The lines under "## <version>" up to the next "## " heading
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > whats-new.md
          if ! grep -q '[^[:space:]]' whats-new.md; then
            echo "::error::CHANGELOG.md has no \"## $VERSION\" section"
            exit 1
          fi
          # Relative links (docs/diesel.md) would point into the releases page
          sed -i -E "s#\]\(([^):]+)\)#](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/\1)#g" whats-new.md
          {
            echo "## What's new"
            cat whats-new.md
            echo
            echo "## Downloads"
            echo
          } > notes.md
          cat notes.md

      - name: Create a draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd upload
          # A release has every platform
          for p in windows-x64.zip macos-arm64.zip linux-x64.tar.gz; do
            ls engine-sim-community-*-"$p" > /dev/null 2>&1 || { echo "::error::No $p download"; exit 1; }
          done
          cat >> ../notes.md <<'EOF'
          **Windows** (10 or 11, 64-bit): download `engine-sim-community-*-windows-x64.zip`, unzip it anywhere you can write to, and run `engine-sim-app.exe`. Nothing needs installing. The app isn't signed, so Windows may show "Windows protected your PC": choose **More info**, then **Run anyway**.

          **macOS** (Apple Silicon, macOS 11 or newer): download `engine-sim-community-*-macos-arm64.zip`, unzip it and move `Engine Sim.app` to Applications. The app isn't signed by an Apple developer, so the first time macOS refuses to open it: open **System Settings > Privacy & Security** and choose **Open Anyway** next to the message about Engine Sim.

          **Linux** (x86-64, glibc 2.35 or newer, such as Ubuntu 22.04, Debian 12 or Fedora 36 and later): install SDL2, SDL2_image and OpenGL (`sudo apt install libsdl2-2.0-0 libsdl2-image-2.0-0 libopengl0 libgl1`, `sudo dnf install SDL2 SDL2_image libglvnd-opengl` or `sudo pacman -S sdl2 sdl2_image`), unpack `engine-sim-community-*-linux-x64.tar.gz` and run `./engine-sim-app` in its folder.

          `SHA256SUMS` holds the checksum of each download.

          See the README for the controls, and CHANGELOG.md for earlier releases.
          EOF
          gh release create "$TAG" * \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag \
            --title "Engine Simulator community collection $TAG" \
            --notes-file ../notes.md
