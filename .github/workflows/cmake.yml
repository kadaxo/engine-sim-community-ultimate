name: CMake

on:
  push:
  pull_request:

env:
  BUILD_TYPE: Release
  # Old submodule CMakeLists still declare cmake_minimum_required() < 3.5,
  # which CMake 4 rejects without this
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Flex/Bison and SDL2 provisioning adapted from jacksonelectrical/engine-sim
      - name: Install Flex and Bison
        shell: pwsh
        run: |
          $installed = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            choco install winflexbison3 --yes --no-progress
            if ($LASTEXITCODE -eq 0) {
              $installed = $true
              break
            }
            if ($attempt -lt 4) {
              Write-Warning "Chocolatey failed; retrying in 20 seconds"
              Start-Sleep -Seconds 20
            }
          }
          if (-not $installed) {
            throw "Chocolatey could not install winflexbison3 after four attempts"
          }
          $flex = (Get-Command win_flex.exe -ErrorAction Stop).Source
          $bison = (Get-Command win_bison.exe -ErrorAction Stop).Source
          "FLEX_EXECUTABLE=$flex" | Out-File $env:GITHUB_ENV -Append
          "BISON_EXECUTABLE=$bison" | Out-File $env:GITHUB_ENV -Append

      - name: Install SDL2
        run: vcpkg install sdl2:x64-windows sdl2-image:x64-windows

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          "-DFLEX_EXECUTABLE=$env:FLEX_EXECUTABLE"
          "-DBISON_EXECUTABLE=$env:BISON_EXECUTABLE"
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --target engine-sim-app engine-sim-test boost-probe

      - name: Test
        run: ctest --test-dir build -C ${{ env.BUILD_TYPE }} --output-on-failure

  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev flex bison

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --parallel --target engine-sim-app engine-sim-test boost-probe

      - name: Test
        run: ctest --test-dir build --output-on-failure
