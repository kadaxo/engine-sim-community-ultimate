name: Idea or request
description: A feature, an engine to add, or a fix from another fork worth bringing in
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: What it should do, and what you'd use it for.
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Where it comes from (if anywhere)
      description: A fork, commit or pull request that already has it, or a reference for an engine (a datasheet, a recording).
      placeholder: https://github.com/someone/engine-sim/commit/...
